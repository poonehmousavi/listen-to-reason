    - {name: vehicle horn, audioset: ["Vehicle horn, car horn, honking", "Air horn, truck horn", Foghorn]}
    - {name: bicycle bell, audioset: [Bicycle bell]}
    - {name: whistle, audioset: [Whistle]}
    - {name: bell, audioset: [Bell]}
    - {name: beep, audioset: ["Beep, bleep"]}
  impact or texture:

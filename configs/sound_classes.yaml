    - {name: cupboard or drawer, audioset: [Cupboard open or close, Drawer open or close]}
    - {name: dishes, audioset: ["Dishes, pots, and pans"]}
    - {name: cutlery, audioset: ["Cutlery, silverware"]}
    - {name: chopping food, audioset: ["Chopping (food)"]}

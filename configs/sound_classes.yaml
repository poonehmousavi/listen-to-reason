    - {name: surface contact, audioset: [Surface contact]}
    - {name: glass, audioset: [Glass]}
    - {name: wood, audioset: [Wood]}
    - {name: liquid, audioset: [Liquid]}
    - {name: explosion or gunshot, audioset: [Explosion]}
    - {name: specific impact, audioset: [Specific impact sounds]}


    - {name: truck, audioset: [Truck]}
    - {name: bus, audioset: [Bus]}
    - {name: emergency vehicle, audioset: [Emergency vehicle]}
    - {name: motorcycle, audioset: [Motorcycle]}
    - {name: traffic noise, audioset: ["Traffic noise, roadway noise"]}
    - {name: rail transport, audioset: [Rail transport]}
    - {name: aircraft, audioset: [Aircraft]}
    - {name: boat, audioset: ["Boat, Water vehicle"]}
    - {name: non-motorized vehicle, audioset: [Non-motorized land vehicle]}
    - {name: engine, audioset: [Engine]}
    - {name: mechanisms, audioset: [Mechanisms]}
  tool:
    - {name: hammer, audioset: [Hammer]}
    - {name: jackhammer, audioset: [Jackhammer]}
    - {name: sawing, audioset: [Sawing]}
    - {name: filing, audioset: ["Filing (rasp)"]}

# Classes of the identity attributes of environmental sound.
#
# Each class is an AudioSet class or a small union of them (`audioset` = its root classes in the AudioSet ontology). An AudioSet class is
# placed under the class whose root is its nearest ontology ancestor (`l2r.tree.sound`). The kinds below become the identity attributes
# (`machine or vehicle` is split into the attributes vehicle and machine).
# `esc50_to_audioset`: ESC-50 category -> AudioSet class, for clips labelled with ESC-50 categories; unmapped categories are not used.

kinds:
  animal:
    - {name: dog, audioset: [Dog]}
    - {name: cat, audioset: [Cat]}
    - {name: horse, audioset: [Horse]}
    - {name: donkey, audioset: ["Donkey, ass"]}
    - {name: cattle, audioset: ["Cattle, bovinae"]}
    - {name: pig, audioset: [Pig]}
    - {name: goat, audioset: [Goat]}
    - {name: sheep, audioset: [Sheep]}
    - {name: fowl, audioset: [Fowl]}
    - {name: bird, audioset: [Bird]}
    - {name: insect, audioset: [Insect]}
    - {name: frog, audioset: [Frog]}
    - {name: snake, audioset: [Snake]}
    - {name: rodent, audioset: ["Rodents, rats, mice"]}
    - {name: roaring big cat, audioset: ["Roaring cats (lions, tigers)"]}
    - {name: whale vocalization, audioset: [Whale vocalization]}
    - {name: wild canid, audioset: ["Canidae, dogs, wolves"]}
  machine or vehicle:

    - {name: microwave oven, audioset: [Microwave oven]}
    - {name: blender, audioset: [Blender]}
    - {name: kettle whistle, audioset: [Kettle whistle]}
    - {name: tap or sink, audioset: ["Water tap, faucet", "Sink (filling or washing)", "Bathtub (filling or washing)"]}
    - {name: hair dryer, audioset: [Hair dryer]}
    - {name: toilet flush, audioset: [Toilet flush]}
    - {name: toothbrush, audioset: [Toothbrush]}
    - {name: vacuum cleaner, audioset: [Vacuum cleaner]}
    - {name: zipper, audioset: ["Zipper (clothing)"]}
    - {name: keys jangling, audioset: [Keys jangling]}
    - {name: coin dropping, audioset: ["Coin (dropping)"]}
    - {name: scissors, audioset: [Scissors]}
    - {name: electric shaver, audioset: ["Electric shaver, electric razor"]}
    - {name: shuffling cards, audioset: [Shuffling cards]}
    - {name: typing, audioset: [Typing]}
    - {name: writing, audioset: [Writing]}
  human non-speech:
    - {name: laughter, audioset: [Laughter]}
    - {name: crying, audioset: ["Crying, sobbing"]}
    - {name: cough, audioset: [Cough]}
    - {name: sneeze, audioset: [Sneeze]}
    - {name: breathing, audioset: [Breathing]}
    - {name: footsteps, audioset: [Human locomotion]}
    - {name: clapping, audioset: [Clapping]}
    - {name: applause, audioset: [Applause]}
    - {name: cheering, audioset: [Cheering]}
    - {name: crowd, audioset: [Crowd]}
    - {name: chatter, audioset: [Chatter]}
    - {name: whistling, audioset: [Whistling]}
    - {name: chewing, audioset: ["Chewing, mastication"]}
    - {name: screaming, audioset: [Screaming]}
